name: Keep Supabase awake
# Free Supabase projects pause after ~7 days without traffic. One tiny request a day prevents that.
on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ts_get with a throwaway key
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            -X POST 'https://gtqwzslmfvfqppletmlx.supabase.co/rest/v1/rpc/ts_get' \
            -H 'apikey: sb_publishable_gQA5BnaiewMFKWBLVzjGFA_ziMIkEtg' \
            -H 'Authorization: Bearer sb_publishable_gQA5BnaiewMFKWBLVzjGFA_ziMIkEtg' \
            -H 'Content-Type: application/json' \
            -d '{"k":"keepalive-ping-not-a-real-key-000000"}')
          echo "HTTP $code: $(cat /tmp/out)"
          test "$code" = "200"
